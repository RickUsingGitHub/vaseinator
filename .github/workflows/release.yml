name: Windows release
on:
  push:
    branches: [main]
    paths:
      - vaseinator/__init__.py
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/tests.yml
  package:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Check desktop design tools
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force work-temp | Out-Null
          python -m unittest tests.test_workspace tests.test_design_tools -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows app
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name Vaseinator --icon assets/icon.ico --add-data "assets;assets" --exclude-module tkinter main.py
      - name: Check packaged app starts and exports
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath dist/Vaseinator.exe -ArgumentList '--screenshot work-temp/packaged.png --export-test work-temp' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id
            throw 'Packaged app did not finish its smoke test.'
          }
          if ($process.ExitCode -ne 0) { throw 'Packaged app exited with an error.' }
          foreach ($path in @('work-temp/packaged.png', 'work-temp/t_vase.stl', 'work-temp/t.3mf')) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing smoke-test output: $path" }
          }
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from vaseinator import __version__; print(__version__)"
          $tag = "v$version"
          $hash = (Get-FileHash -Algorithm SHA256 dist/Vaseinator.exe).Hash.ToLower()
          "$hash  Vaseinator.exe" | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
          @'
          Matching desktop and web design tools: Surprise locks, printer/material profiles, a design library with favourites and recovery, portable library backups, original/softened side comparison, and printable clearance samples.

          Fixes lost browser edits, printer-setting rollback, non-finite design inputs and export validation differences.

          Download Vaseinator.exe below for Windows; no Python installation is required. The app is not code-signed. The web app is at https://rickusinggithub.github.io/vaseinator/.

          Library thumbnails and comparison use silhouettes/side profiles. Calibration samples test general clearances rather than replicating lid latches. Libraries are stored locally; use export/import to transfer them between desktop and web.
          '@ | Set-Content -Encoding utf8 work-temp/release-notes.md
          gh release create $tag dist/Vaseinator.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Vaseinator $version" --notes-file work-temp/release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

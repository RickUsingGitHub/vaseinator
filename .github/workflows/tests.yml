name: Regression checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install numpy pyfqmr
      - run: python -m tests.test_vase
      - run: python -m unittest tests.test_workspace -v
      - run: node tests/test_web_state.cjs
